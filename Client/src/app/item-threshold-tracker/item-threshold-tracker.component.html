<div class="p-6 bg-gray-50 min-h-screen">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Threshold Tracker</h1>

    <div class="space-y-4">
        <div *ngFor="let item of items"
            class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex items-center justify-between hover:shadow-md transition">
            <!-- Item Info -->
            <div class="flex-1 grid grid-cols-4 gap-6">
                <div>
                    <div class="text-xs uppercase text-gray-500">ID</div>
                    <div class="font-semibold text-gray-800">{{ item.id }}</div>
                </div>

                <div>
                    <div class="text-xs uppercase text-gray-500">Name</div>
                    <div class="font-medium text-gray-700">{{ item.name }}</div>
                </div>

                <div>
                    <div class="text-xs uppercase text-gray-500">Quantity</div>
                    <div class="text-gray-700">{{ item.quantity }}</div>
                </div>

                <div>
                    <div class="text-xs uppercase text-gray-500">Threshold</div>
                    <div class="text-gray-700">{{ item.reorderThreshold }}</div>
                </div>
            </div>

            <!-- Status -->
            <div class="flex items-center space-x-4">
                <ng-container [ngSwitch]="getStockStatus(item)">
                    <!-- Critical -->
                    <div *ngSwitchCase="'critical'" class="flex items-center text-red-600 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 9v2m0 4h.01M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14" />
                        </svg>
                        Critical
                    </div>

                    <!-- Low -->
                    <div *ngSwitchCase="'low'" class="flex items-center text-yellow-600 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3" />
                        </svg>
                        Low
                    </div>

                    <!-- Good -->
                    <div *ngSwitchCase="'good'" class="flex items-center text-green-600 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        In Stock
                    </div>
                </ng-container>

                <!-- Actions -->
                <button class="px-3 py-1 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm shadow-sm">
                    Edit Threshold
                </button>
            </div>
        </div>
    </div>
</div>
